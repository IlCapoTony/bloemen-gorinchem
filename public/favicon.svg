<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a503a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357a4a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle (Optioneel, maar maakt het mooi in tabbladen) -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" />
  
  <!-- Flower shape (Tulip/Rose outline) -->
  <path d="M50 80 Q50 60 70 40 Q80 30 70 20 Q60 10 50 30 Q40 10 30 20 Q20 30 30 40 Q50 60 50 80 Z" fill="#ffffff" />
  
  <!-- Stem -->
  <path d="M50 80 L50 90" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Leaf -->
  <path d="M50 85 Q65 85 75 75 Q65 95 50 85 Z" fill="#ffffff" />
</svg>
